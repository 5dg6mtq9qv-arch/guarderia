<div class="form-group {% if field.field.widget.input_type == 'checkbox' %}form-check{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<b>*</b>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>
